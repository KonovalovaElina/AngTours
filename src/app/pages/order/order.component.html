<a routerLink="/">Назад</a>
<h2>Оформление заказа</h2>
<div class="order-card col-6">
  @if (tour) {
    <div class="tour-info mt-3">
      <h3>{{ tour.name }}</h3>
      <p>{{ tour.description }}</p>
      <p><strong>Оператор:</strong> {{ tour.tourOperator }}</p>
      <p><strong>Дата:</strong> {{ tour.date | date: 'longDate' }}</p>
      <p><strong>Цена:</strong> {{ tour.price }}</p>
    </div>
  } @else {
    <p class="text-muted">Тур загружается…</p>
  }

  <div class="order-layout mt-3">
    <h3>Информация о покупателе</h3>
    <form (ngSubmit)="onSubmit()" [formGroup]="userForm">
      <div class="mt-3 user-info">
        @for (field of userFormFieldsArr; track field.control) {
          <ng-container
            [ngTemplateOutlet]="formField"
            [ngTemplateOutletContext]="field" />
        }

        <div class="form-group mt-3">
          <button type="submit" [disabled]="userForm.invalid" mat-raised-button>
            Перейти к оформлению
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<ng-template #formField let-control="control" let-placeHolder="placeHolder" let-label="label" let-type="type">
  <div [formGroup]="userForm" class="form-group mt-3">
    <label [attr.for]="control" class="mx-3">{{ label }}</label>
    <input
      [type]="type"
      class="form-control mt-3"
      [id]="control"
      [formControlName]="control"
      [placeholder]="placeHolder">
  </div>
</ng-template>
