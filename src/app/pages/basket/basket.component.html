<table mat-table [dataSource]="basketItems$ | async" class="mat-elevation-z8" style="min-width: 50rem">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Тур</th>
    <td mat-cell *matCellDef="let tour">{{ tour.name }}</td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef>Цена</th>
    <td mat-cell *matCellDef="let tour">{{ tour.price }}</td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Дата</th>
    <td mat-cell *matCellDef="let tour">{{ tour.date | date: 'longDate' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let tour">
      <button mat-icon-button (click)="removeItemFromBasket(tour)" aria-label="Удалить тур из корзины">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>

<button mat-raised-button>Оформить заказ</button>
