<div class="orders-page">
  <h4>Заказы</h4
    >

  <div class="table-wrapper mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" *ngIf="!isLoading">

      <ng-container matColumnDef="_id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let order">{{ order._id }}</td>
      </ng-container>

      <ng-container matColumnDef="userId">
        <th mat-header-cell *matHeaderCellDef>Пользователь</th>
        <td mat-cell *matCellDef="let order">{{ order.userId || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="tourId">
        <th mat-header-cell *matHeaderCellDef>Тур</th>
        <td mat-cell *matCellDef="let order">{{ order.tourId || '—' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          Активных заказов нет
        </td>
      </tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[10, 20, 50]"
      [pageSize]="20"
      [length]="total"
      (page)="onPageChange()"
      showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
