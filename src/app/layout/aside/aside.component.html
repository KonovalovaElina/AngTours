<div class="aside m-3 h-100">
  <h6>Тип тура</h6>
  <mat-form-field>
    <mat-label>Выберите тип тура</mat-label>
    <mat-select [value]="selectedType" (selectionChange)="onTypeChange($event.value)">
      @for (item of tourTypes; track item.key) {
        <mat-option [value]="item.key">{{ item.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <h6>Дата вылета</h6>
  <mat-form-field>
    <mat-label>Выберите дату</mat-label>
    <input matInput [matDatepicker]="selectedDate" [value]="selectedDate" (dateChange)="onDateChange($event)">
    <mat-hint>MM/DD/YYYY</mat-hint>
    <mat-datepicker-toggle matIconSuffix [for]="selectedDate"></mat-datepicker-toggle>
    <mat-datepicker #selectedDate></mat-datepicker>
  </mat-form-field>

  <button mat-flat-button (click)="onResetFilters()">Сбросить фильтры</button>
</div>
